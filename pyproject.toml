[project]
name = "agentic-customer-care"
version = "0.1.0"
description = ""
authors = [
    {name = "Giuseppe Monitillo", email = "Giuseppe.Monitillo@ext.luxottica.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain-core (>=1.6.9,<2.0.0)",
    "langchain (>=1.4.4,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-openai (>=1.7.1,<2.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "markdown2 (>=2.5.5,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "deepeval (>=4.3.1,<5.0.0)"
]

[project.scripts]
ingest = "agentic_customer_care.rag.ingestion:run_ingestion_pipeline"
test_retrival =  "agentic_customer_care.rag.retrival:test_retrieve_documents_from_vectorstore"

run_agent_gateway = "agentic_customer_care.api_gateway.fast_api:init_gateway"

test_extractor = "agentic_customer_care.agent.entity_extractor:test_enity_extractor"
evaluate_rag = "agentic_customer_care.rag.evaluation.ragas_evauation:evaluate_rag"
evaluate_rag_deepeval = "agentic_customer_care.rag.evaluation.deepeval_evaluation:evaluate_rag_deepeval"

[tool.poetry]
packages = [
    {include = "agentic_customer_care", from = "src"},
    {include = "utils", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.6.3,<8.0.0)"
]
